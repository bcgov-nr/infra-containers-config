name: Cleanup GHCR Docker Images

on:
  workflow_dispatch:     # Allows manual trigger

permissions: {}

concurrency:
  group: ${{ github.repository }}-jenkins-ghcr
  cancel-in-progress: false

jobs:
  clean-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out cleanup script
        uses: actions/checkout@v4

      - name: Clean up unreferenced package versions
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const cleanup = require('./.github/scripts/cleanup-jenkins-images.cjs');
            await cleanup({github, context, core});