name: Build Bitnami Jenkins Image

on:
  workflow_dispatch:
    inputs:
      jenkins_tag:
        description: "Bitnami Jenkins image tag (leave blank for the latest release)"
        required: false
        default: ""
        type: string
      build_mode:
        description: "Build without publishing, or publish the image to GHCR"
        required: true
        type: choice
        options:
          - build-only
          - publish
        default: build-only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      commit: ${{ steps.resolve.outputs.commit }}
      update_latest: ${{ steps.resolve.outputs.update_latest }}

    steps:
      - name: Resolve Jenkins release
        id: resolve
        env:
          REQUESTED_TAG: ${{ inputs.jenkins_tag }}
        run: |
          set -euo pipefail
          git clone --filter=tree:0 --no-checkout https://github.com/bitnami/containers.git bitnami-containers
          cd bitnami-containers

          RELEASE_REGEX='^\[bitnami/jenkins\] Release ([0-9]+\.[0-9]+\.[0-9]+-debian-12-r[0-9]+) \(#[0-9]+\)$'
          LATEST_LINE=$(git log --all --extended-regexp --grep="$RELEASE_REGEX" --format='%H%x09%s' --max-count=1)
          if [[ -z "$LATEST_LINE" ]]; then
            echo "::error::Could not find the latest Bitnami Jenkins Debian 12 release"
            exit 1
          fi
          IFS=$'\t' read -r LATEST_COMMIT LATEST_SUBJECT <<< "$LATEST_LINE"
          if [[ "$LATEST_SUBJECT" =~ $RELEASE_REGEX ]]; then
            LATEST_TAG="${BASH_REMATCH[1]}"
          else
            echo "::error::Could not parse the latest Bitnami release commit: $LATEST_SUBJECT"
            exit 1
          fi

          if [[ -n "$REQUESTED_TAG" ]]; then
            if [[ ! "$REQUESTED_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-debian-12-r[0-9]+$ ]]; then
              echo "::error::Invalid Jenkins image tag: $REQUESTED_TAG"
              exit 1
            fi

            RELEASE_LINE=$(git log --all --fixed-strings --grep="[bitnami/jenkins] Release ${REQUESTED_TAG} (#" --format='%H%x09%s' --max-count=1)
            if [[ -z "$RELEASE_LINE" ]]; then
              echo "::error::No Bitnami Jenkins release commit found for $REQUESTED_TAG"
              exit 1
            fi

            IFS=$'\t' read -r RELEASE_COMMIT RELEASE_SUBJECT <<< "$RELEASE_LINE"
            if [[ ! "$RELEASE_SUBJECT" =~ $RELEASE_REGEX ]] || [[ "${BASH_REMATCH[1]}" != "$REQUESTED_TAG" ]]; then
              echo "::error::The matching commit is not an exact Bitnami release for $REQUESTED_TAG"
              exit 1
            fi
            IMAGE_TAG="$REQUESTED_TAG"
            UPDATE_LATEST=false
            if [[ "$IMAGE_TAG" == "$LATEST_TAG" ]]; then
              UPDATE_LATEST=true
            fi
          else
            RELEASE_COMMIT="$LATEST_COMMIT"
            IMAGE_TAG="$LATEST_TAG"
            UPDATE_LATEST=true
          fi

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "update_latest=$UPDATE_LATEST" >> "$GITHUB_OUTPUT"
          {
            echo "### Resolved Bitnami Jenkins release"
            echo "- Image tag: \`$IMAGE_TAG\`"
            echo "- Source commit: \`$RELEASE_COMMIT\`"
            echo "- Update latest alias: \`$UPDATE_LATEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-only:
    if: inputs.build_mode == 'build-only'
    needs: resolve-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Bitnami source at exact release commit
        env:
          COMMIT: ${{ needs.resolve-release.outputs.commit }}
        run: |
          git clone --filter=tree:0 --no-checkout https://github.com/bitnami/containers.git bitnami-containers
          git -C bitnami-containers sparse-checkout init --cone
          git -C bitnami-containers sparse-checkout set bitnami/jenkins
          git -C bitnami-containers checkout "$COMMIT"
          ACTUAL_COMMIT=$(git -C bitnami-containers rev-parse HEAD)
          if [[ "$ACTUAL_COMMIT" != "$COMMIT" ]]; then
            echo "::error::Checked out $ACTUAL_COMMIT instead of resolved commit $COMMIT"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Bitnami Jenkins image without publishing
        env:
          IMAGE_TAG: ${{ needs.resolve-release.outputs.image_tag }}
          SOURCE_COMMIT: ${{ needs.resolve-release.outputs.commit }}
        run: |
          cd bitnami-containers/bitnami/jenkins/2/debian-12
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}/jenkins"
          docker buildx build --load \
            --label "org.opencontainers.image.source=https://github.com/bitnami/containers" \
            --label "org.opencontainers.image.revision=$SOURCE_COMMIT" \
            --label "org.opencontainers.image.version=$IMAGE_TAG" \
            -t "$IMAGE_NAME:$IMAGE_TAG" .

          IMAGE_LABELS=$(docker image inspect --format '{{json .Config.Labels}}' "$IMAGE_NAME:$IMAGE_TAG")
          jq -e --arg commit "$SOURCE_COMMIT" --arg tag "$IMAGE_TAG" \
            '."org.opencontainers.image.source" == "https://github.com/bitnami/containers" and ."org.opencontainers.image.revision" == $commit and ."org.opencontainers.image.version" == $tag' \
            <<< "$IMAGE_LABELS" >/dev/null
          IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$IMAGE_NAME:$IMAGE_TAG")
          {
            echo "Built \`$IMAGE_NAME:$IMAGE_TAG\` without publishing."
            echo "- Source commit verified: \`$SOURCE_COMMIT\`"
            echo "- Image config digest: \`$IMAGE_ID\`"
            echo "- OCI source, revision, and version labels verified."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-image:
    if: inputs.build_mode == 'publish'
    needs: resolve-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check whether the versioned image tag already exists
        id: version-tag
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.resolve-release.outputs.image_tag }}
          IMAGE_PATH: ${{ github.repository }}/jenkins
        run: |
          set -euo pipefail
          IMAGE_PATH="${IMAGE_PATH,,}"
          REGISTRY_TOKEN=$(curl -fsSL --user "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
            --get \
            --data-urlencode "service=ghcr.io" \
            --data-urlencode "scope=repository:${IMAGE_PATH}:pull" \
            https://ghcr.io/token | jq -er '.token // .access_token')
          MANIFEST_HEADERS=$(mktemp)
          MANIFEST_STATUS=$(curl --silent --show-error --head --dump-header "$MANIFEST_HEADERS" --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${REGISTRY_TOKEN}" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${IMAGE_PATH}/manifests/${IMAGE_TAG}")
          MANIFEST_DIGEST=$(awk 'tolower($1) == "docker-content-digest:" { gsub("\r", "", $2); digest = $2 } END { print digest }' "$MANIFEST_HEADERS")
          rm -f "$MANIFEST_HEADERS"

          case "$MANIFEST_STATUS" in
            200)
              if [[ ! "$MANIFEST_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                echo "::error::GHCR returned an invalid manifest digest for $IMAGE_TAG"
                exit 1
              fi
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "digest=$MANIFEST_DIGEST" >> "$GITHUB_OUTPUT"
              echo "Versioned image tag \`$IMAGE_TAG\` already exists; it will not be overwritten." >> "$GITHUB_STEP_SUMMARY"
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Could not verify whether GHCR image tag $IMAGE_TAG exists (HTTP $MANIFEST_STATUS)."
              exit 1
              ;;
          esac

      - name: Summarize publish plan
        env:
          IMAGE_TAG: ${{ needs.resolve-release.outputs.image_tag }}
          TAG_EXISTS: ${{ steps.version-tag.outputs.exists }}
          UPDATE_LATEST: ${{ needs.resolve-release.outputs.update_latest }}
        run: |
          if [[ "$TAG_EXISTS" == "true" && "$UPDATE_LATEST" != "true" ]]; then
            echo "### Publish plan: no-op" >> "$GITHUB_STEP_SUMMARY"
            echo "The versioned image \`$IMAGE_TAG\` already exists and this is not the newest release. No build or push will occur." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$TAG_EXISTS" == "true" ]]; then
            echo "### Publish plan: update latest alias only" >> "$GITHUB_STEP_SUMMARY"
            echo "The versioned image \`$IMAGE_TAG\` already exists and will not be overwritten. The existing image will be assigned to \`latest\`." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$UPDATE_LATEST" == "true" ]]; then
            echo "### Publish plan: build and publish" >> "$GITHUB_STEP_SUMMARY"
            echo "Build and publish \`$IMAGE_TAG\`, then assign the same image to \`latest\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Publish plan: build and publish versioned tag" >> "$GITHUB_STEP_SUMMARY"
            echo "Build and publish \`$IMAGE_TAG\`. The \`latest\` alias will remain unchanged." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out Bitnami source at exact release commit
        if: steps.version-tag.outputs.exists != 'true'
        env:
          COMMIT: ${{ needs.resolve-release.outputs.commit }}
        run: |
          git clone --filter=tree:0 --no-checkout https://github.com/bitnami/containers.git bitnami-containers
          git -C bitnami-containers sparse-checkout init --cone
          git -C bitnami-containers sparse-checkout set bitnami/jenkins
          git -C bitnami-containers checkout "$COMMIT"
          ACTUAL_COMMIT=$(git -C bitnami-containers rev-parse HEAD)
          if [[ "$ACTUAL_COMMIT" != "$COMMIT" ]]; then
            echo "::error::Checked out $ACTUAL_COMMIT instead of resolved commit $COMMIT"
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.version-tag.outputs.exists != 'true' || needs.resolve-release.outputs.update_latest == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.version-tag.outputs.exists != 'true' || needs.resolve-release.outputs.update_latest == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Bitnami Jenkins image
        if: steps.version-tag.outputs.exists != 'true'
        id: build
        env:
          IMAGE_TAG: ${{ needs.resolve-release.outputs.image_tag }}
          SOURCE_COMMIT: ${{ needs.resolve-release.outputs.commit }}
          UPDATE_LATEST: ${{ needs.resolve-release.outputs.update_latest }}
        run: |
          cd bitnami-containers/bitnami/jenkins/2/debian-12
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}/jenkins"
          TAGS=(-t "$IMAGE_NAME:$IMAGE_TAG")
          if [[ "$UPDATE_LATEST" == "true" ]]; then
            TAGS+=(-t "$IMAGE_NAME:latest")
          fi
          docker buildx build --push --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --label "org.opencontainers.image.source=https://github.com/bitnami/containers" \
            --label "org.opencontainers.image.revision=$SOURCE_COMMIT" \
            --label "org.opencontainers.image.version=$IMAGE_TAG" \
            "${TAGS[@]}" .
          BUILT_DIGEST=$(jq -er '.["containerimage.digest"]' "$RUNNER_TEMP/build-metadata.json")
          if [[ ! "$BUILT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Buildx did not return a valid published image digest"
            exit 1
          fi
          echo "digest=$BUILT_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Verify published image provenance labels
        if: steps.version-tag.outputs.exists != 'true'
        env:
          IMAGE_TAG: ${{ needs.resolve-release.outputs.image_tag }}
          SOURCE_COMMIT: ${{ needs.resolve-release.outputs.commit }}
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}/jenkins"
          docker pull "$IMAGE_NAME:$IMAGE_TAG"
          IMAGE_LABELS=$(docker image inspect --format '{{json .Config.Labels}}' "$IMAGE_NAME:$IMAGE_TAG")
          jq -e --arg commit "$SOURCE_COMMIT" --arg tag "$IMAGE_TAG" \
            '."org.opencontainers.image.source" == "https://github.com/bitnami/containers" and ."org.opencontainers.image.revision" == $commit and ."org.opencontainers.image.version" == $tag' \
            <<< "$IMAGE_LABELS" >/dev/null
          echo "Verified OCI source, revision, and version labels on the published image." >> "$GITHUB_STEP_SUMMARY"

      - name: Update latest alias for the newest upstream release
        if: steps.version-tag.outputs.exists == 'true' && needs.resolve-release.outputs.update_latest == 'true'
        env:
          IMAGE_TAG: ${{ needs.resolve-release.outputs.image_tag }}
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}/jenkins"
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE_NAME:latest" "$IMAGE_NAME:$IMAGE_TAG"

      - name: Verify published GHCR digest
        if: steps.version-tag.outputs.exists != 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.resolve-release.outputs.image_tag }}
          IMAGE_PATH: ${{ github.repository }}/jenkins
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE_PATH="${IMAGE_PATH,,}"
          REGISTRY_TOKEN=$(curl -fsSL --user "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
            --get \
            --data-urlencode "service=ghcr.io" \
            --data-urlencode "scope=repository:${IMAGE_PATH}:pull" \
            https://ghcr.io/token | jq -er '.token // .access_token')

          MANIFEST_HEADERS=$(mktemp)
          MANIFEST_STATUS=$(curl --silent --show-error --head --dump-header "$MANIFEST_HEADERS" --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${REGISTRY_TOKEN}" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${IMAGE_PATH}/manifests/${IMAGE_TAG}")
          PUBLISHED_DIGEST=$(awk 'tolower($1) == "docker-content-digest:" { gsub("\r", "", $2); digest = $2 } END { print digest }' "$MANIFEST_HEADERS")
          rm -f "$MANIFEST_HEADERS"
          if [[ "$MANIFEST_STATUS" != "200" || "$PUBLISHED_DIGEST" != "$EXPECTED_DIGEST" ]]; then
            echo "::error::GHCR digest verification failed for $IMAGE_TAG (HTTP $MANIFEST_STATUS, expected $EXPECTED_DIGEST, got $PUBLISHED_DIGEST)"
            exit 1
          fi
          echo "Verified versioned tag \`$IMAGE_TAG\` at \`$PUBLISHED_DIGEST\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize image publish
        if: success()
        env:
          IMAGE_TAG: ${{ needs.resolve-release.outputs.image_tag }}
          UPDATE_LATEST: ${{ needs.resolve-release.outputs.update_latest }}
          TAG_EXISTS: ${{ steps.version-tag.outputs.exists }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest || steps.version-tag.outputs.digest }}
        run: |
          if [[ "$TAG_EXISTS" == "true" && "$UPDATE_LATEST" != "true" ]]; then
            echo "### Publish result: no-op" >> "$GITHUB_STEP_SUMMARY"
            echo "The versioned image already existed; no build or push was performed." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$TAG_EXISTS" == "true" ]]; then
            echo "### Publish result: latest alias updated" >> "$GITHUB_STEP_SUMMARY"
            echo "The existing versioned image was not overwritten; the \`latest\` alias update command succeeded." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Publish result: image published" >> "$GITHUB_STEP_SUMMARY"
            echo "Published versioned image \`$IMAGE_TAG\` at \`$IMAGE_DIGEST\`." >> "$GITHUB_STEP_SUMMARY"
            if [[ "$UPDATE_LATEST" == "true" ]]; then
              echo "The \`latest\` alias update command succeeded." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Left \`latest\` unchanged." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "Image publish workflow completed." >> "$GITHUB_STEP_SUMMARY"
